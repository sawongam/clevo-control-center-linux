name: Release

# Every push to master runs the checks and builds the packages. The version comes from the
# VERSION file as it is. When no release exists for that version yet, the packages are published
# as release "Clevo Control Center <version>" with tag v<version>; otherwise publishing is skipped,
# so bump VERSION to ship a new release. A manual run does everything except publishing.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  packages:
    name: Tarball and .deb
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: scripts/build.sh --self-contained
      - name: Check that the self-contained build starts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-noto-core
          CCENTER_CONFIG="$RUNNER_TEMP/config" dist/ControlCenter30/ControlCenter30 --screenshot "$RUNNER_TEMP/launcher.png"
      - name: Package
        run: |
          mkdir out
          packaging/tarball/build.sh out
          packaging/deb/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/

  arch:
    name: Arch package
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build with makepkg
        run: |
          pacman -Syu --noconfirm dotnet-sdk
          version=${{ needs.version.outputs.version }}
          sed -i "s/^pkgver=.*/pkgver=$version/" packaging/arch/PKGBUILD
          # makepkg uses a source file that is already next to the PKGBUILD, so the package is
          # built from this checkout and not from a tag on GitHub.
          tar -czf "/tmp/ccenter-$version.tar.gz" --transform "s|^\.|clevo-control-center-linux-$version|" .
          mv "/tmp/ccenter-$version.tar.gz" packaging/arch/
          useradd -m builder
          chown -R builder packaging/arch
          cd packaging/arch
          sudo -u builder makepkg --nodeps
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [checks, version, packages, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check whether this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released; bump VERSION to publish a new release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.released == 'false'
        with:
          path: out
          pattern: '*package*'
          merge-multiple: true
      - name: Create release
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Clevo Control Center $VERSION" --latest --generate-notes *
