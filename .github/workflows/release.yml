name: Release

# Every push to master runs the checks, builds the packages and publishes them as a release.
# The version is MAJOR.MINOR from the VERSION file plus the number of commits on master.
# A manual run does everything except publishing.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(cut -d. -f1,2 VERSION).$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  packages:
    name: Tarball and .deb
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: echo "${{ needs.version.outputs.version }}" > VERSION
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: scripts/build.sh --self-contained
      - name: Check that the self-contained build starts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-noto-core
          RIPPLE_CC_CONFIG="$RUNNER_TEMP/config" dist/ControlCenter30/ControlCenter30 --screenshot "$RUNNER_TEMP/launcher.png"
      - name: Package
        run: |
          mkdir out
          packaging/tarball/build.sh out
          packaging/deb/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/

  arch:
    name: Arch package
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build with makepkg
        run: |
          pacman -Syu --noconfirm dotnet-sdk
          version=${{ needs.version.outputs.version }}
          echo "$version" > VERSION
          sed -i "s/^pkgver=.*/pkgver=$version/" packaging/arch/PKGBUILD
          # makepkg uses a source file that is already next to the PKGBUILD, so the package is
          # built from this checkout and not from a tag on GitHub.
          tar -czf "/tmp/ripple-cc-$version.tar.gz" --transform "s|^\.|clevo-control-center-linux-$version|" .
          mv "/tmp/ripple-cc-$version.tar.gz" packaging/arch/
          useradd -m builder
          chown -R builder packaging/arch
          cd packaging/arch
          sudo -u builder makepkg --nodeps
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [checks, version, packages, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: '*package*'
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          cd out
          sha256sum * > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes *
